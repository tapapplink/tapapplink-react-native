def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Standalone CI (ci/android) has no host app classpath; RN host apps do.
buildscript {
  if (rootProject.name == "tapapplink-android-ci") {
    repositories {
      google()
      mavenCentral()
    }
    dependencies {
      classpath("com.android.tools.build:gradle:8.7.2")
    }
  }
}

apply plugin: "com.android.library"

android {
  namespace "com.tapapplink.reactnative"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Host React Native apps leave this unversioned so the app's RN Gradle
  // plugin supplies the artifact. Standalone CI sets ext.reactNativeVersion.
  def reactNativeVersion = safeExtGet("reactNativeVersion", "")
  if (reactNativeVersion) {
    implementation "com.facebook.react:react-android:${reactNativeVersion}"
  } else {
    implementation "com.facebook.react:react-android"
  }
  implementation "com.android.installreferrer:installreferrer:2.2"
}
